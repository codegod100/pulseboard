[workspace]
name = "pulseboard"
description = "An RSS reader on Cloudflare: a Python Worker and an ultra web client"
channels = ["https://conda.anaconda.org/conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.13.*"
nodejs = ">=22"
pytest = "*"
cryptography = "*"

[tasks]
# --- tests ---
test-worker = { cmd = "python -m pytest -q tests", cwd = "worker", description = "Reader tests under CPython against SQLite" }
test-pyodide = { cmd = "npm ci --silent && npm test", cwd = "worker/tests/pyodide", description = "entry.py under Pyodide in Node, against D1/assets stand-ins" }
test = { depends-on = ["test-worker", "test-pyodide"], description = "Run every Worker test" }

# --- web client ---
build-web = { cmd = "bash web/build.sh", description = "Rebuild web/dist from web/app.py with ultra" }

# --- Cloudflare (run `pixi run login` once) ---
login = { cmd = "npx --yes wrangler@4 login", cwd = "worker", description = "Sign wrangler in to Cloudflare" }
db-create = { cmd = "npx --yes wrangler@4 d1 create pulseboard", cwd = "worker", description = "Create the D1 database (first time only); put the printed id in worker/wrangler.toml" }
migrate = { cmd = "npx --yes wrangler@4 d1 migrations apply pulseboard --remote", cwd = "worker", description = "Apply D1 migrations to the live database" }
dev = { cmd = "npx --yes wrangler@4 dev", cwd = "worker", description = "Run the Worker locally against a local D1" }
deploy = { cmd = "npx --yes wrangler@4 deploy", cwd = "worker", depends-on = ["test", "migrate"], description = "Test, migrate, then deploy the Worker" }
