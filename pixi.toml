[workspace]
name = "pulseboard"
description = "An RSS reader: a FastAPI server (on FastAPI Cloud, with Neon) and a Qt for WebAssembly web client"
channels = ["https://conda.anaconda.org/conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.13.*"
nodejs = ">=22"
pytest = "*"
cryptography = "*"
# The server's dependencies (pyproject.toml), for the CPython tests and the D1
# copy script; httpx also drives the FastAPI app in the tests.
fastapi = "*"
python-multipart = "*"
httpx = "*"
psycopg = "*"
psycopg-pool = "*"
uv = ">=0.12.3"

[tasks]
# --- tests ---
test-worker = { cmd = "python -m pytest -q tests", cwd = "worker", description = "Reader tests under CPython against SQLite" }
test-pyodide = { cmd = "npm ci --silent && npm test", cwd = "worker/tests/pyodide", description = "entry.py under Pyodide in Node, against D1/assets stand-ins" }
test = { depends-on = ["test-worker", "test-pyodide"], description = "Run every Worker test" }

# --- web client ---
web-toolchain = { cmd = "bash web/toolchain.sh", description = "Set up Emscripten and Qt for WebAssembly in .qt (once; about a minute)" }
build-web = { cmd = "bash web/build.sh", description = "Rebuild web/dist from web/src and web/qml with Qt for WebAssembly" }

# --- FastAPI Cloud (the server in main.py; `just deploy` sets it up) ---
serve = { cmd = "uv run --frozen fastapi dev", description = "Run the server locally against a local SQLite file, with reload" }
redeploy = { cmd = "git pull --ff-only && pixi run test-worker && uv run --frozen fastapi deploy", description = "Pull main, test, then deploy to FastAPI Cloud (signs in through the browser the first time)" }
migrate-d1 = { cmd = "python scripts/d1_to_postgres.py --d1 pulseboard", cwd = "worker", description = "Copy feeds, subscriptions, articles and read state from Cloudflare D1 into DATABASE_URL (Neon)" }
