<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A fast, focused personal feed reader.">
  <meta name="theme-color" content="#00754A" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulseboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Pulseboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The whole app is a Qt Quick scene drawn into this element. -->
  <a id="screen-link" draggable="false" tabindex="-1"><div id="screen"></div></a>
  <div id="splash" role="status" aria-label="Loading Pulseboard">
    <div class="spinner"></div>
    <p id="splash-error" hidden></p>
  </div>

  <script src="qtloader.js"></script>
  <script src="pulseboard.js"></script>
  <script type="module">
    const screen = document.getElementById("screen");
    const splash = document.getElementById("splash");
    const fail = (msg) => {
      const p = document.getElementById("splash-error");
      p.textContent = msg;
      p.hidden = false;
      splash.querySelector(".spinner").hidden = true;
    };
    // The app is drawn on a canvas, so the browser has no links to offer a menu
    // for. While the pointer is over an article the app hands us its link, and
    // the <a> around the canvas takes it as its href: a right click (or a long
    // press) then gets the browser's own link menu, with open in new tab and
    // copy link. Clicks stay the app's: it opens the tab itself.
    const link = document.getElementById("screen-link");
    window.pbHoverLinkChanged = (url) => {
      window.pbHoverLink = url;
      if (url) link.href = url;
      else link.removeAttribute("href");
    };
    // Qt cancels the menu on its canvas; keep the event from reaching it.
    window.addEventListener("contextmenu", (e) => { if (link.href) e.stopPropagation(); }, true);
    for (const type of ["click", "auxclick", "dragstart"]) {
      window.addEventListener(type, (e) => { if (link.contains(e.target)) e.preventDefault(); }, true);
    }

    try {
      // The browser test reaches the app's state through this.
      // build.sh ships the wasm gzipped under a hashed name; unpack it here.
      const wasm = fetch("pulseboard.wasm.gz").then((r) => {
        if (!r.ok) throw new Error("fetching the app: HTTP " + r.status);
        const body = r.body.pipeThrough(new DecompressionStream("gzip"));
        return WebAssembly.compileStreaming(
          new Response(body, { headers: { "Content-Type": "application/wasm" } }));
      });
      window.pulseboard = await qtLoad({
        qt: {
          module: wasm,
          containerElements: [screen],
          entryFunction: window.pulseboard_entry,
          onLoaded: () => splash.remove(),
          onExit: (e) => { if (e.code !== 0) fail("Pulseboard stopped (" + (e.text ?? e.code) + ")."); },
        },
      });
    } catch (e) {
      fail("Pulseboard couldn't start: " + e);
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/pulseboard_service_worker.js").catch(() => {});
    }
  </script>
</body>
</html>
