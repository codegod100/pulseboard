name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulseboard-production
  cancel-in-progress: false

env:
  PIXI_VERSION: v0.82.1

jobs:
  test:
    name: Test the Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The tests run each database test on Postgres too, as Neon is in production.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PULSEBOARD_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Test
        run: pixi run --locked test

  deploy-fastapi-cloud:
    name: Deploy to FastAPI Cloud
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
      FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
    steps:
      - name: Check deployment credentials
        id: creds
        # Without the secrets the server is deployed by hand with
        # `just deploy`, so this is a skip, not a failure.
        run: |
          if [[ -z "$FASTAPI_CLOUD_TOKEN" || -z "$FASTAPI_CLOUD_APP_ID" ]]; then
            echo "::notice::No FASTAPI_CLOUD_TOKEN / FASTAPI_CLOUD_APP_ID secrets; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.creds.outputs.ready == 'true'

      - uses: astral-sh/setup-uv@v7
        if: steps.creds.outputs.ready == 'true'

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: uv run --frozen fastapi deploy
