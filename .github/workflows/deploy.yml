name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulseboard-production
  cancel-in-progress: false

jobs:
  test:
    name: Test the Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit tests (CPython, SQLite)
        working-directory: worker
        run: |
          python -m pip install pytest cryptography
          python -m pytest -q tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Runtime adapters under Pyodide
        working-directory: worker/tests/pyodide
        run: |
          npm ci
          npm test

  deploy:
    name: Deploy to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check deployment credentials
        id: creds
        # Without the secrets the Worker is deployed by hand (see
        # worker/readme.md), so this is a skip, not a failure.
        working-directory: .
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Install Wrangler
        if: steps.creds.outputs.ready == 'true'
        run: npm install --no-save wrangler@4

      - name: Find or create the D1 database
        if: steps.creds.outputs.ready == 'true'
        # The database id is account-specific, so it is looked up here rather
        # than committed.
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "pulseboard") | .uuid')
          if [[ -z "$id" ]]; then
            npx wrangler d1 create pulseboard
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "pulseboard") | .uuid')
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml
          echo "D1 database: $id"

      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply pulseboard --remote

      - name: Make sure the web client is there
        if: steps.creds.outputs.ready == 'true'
        # The ultra client is committed under web/dist. Until it is, serve a
        # placeholder rather than fail the deploy.
        run: |
          if [[ ! -f ../web/dist/index.html ]]; then
            mkdir -p ../web/dist
            echo '<!doctype html><title>Pulseboard</title><p>The web client is not built yet. The API is up.</p>' > ../web/dist/index.html
          fi

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy
